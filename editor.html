<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Studio | Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --bg: #050505; --ui: #121214; --orange: #f29979; --border: #252528; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        nav { height: 50px; background: var(--ui); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); }
        .main { flex: 1; display: flex; }
        #viewport { flex: 1; }
        #logic-panel { width: 300px; background: var(--ui); border-left: 1px solid var(--border); padding: 10px; }
        .btn { background: #2a2a2d; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; cursor: pointer; margin-bottom: 5px; width: 100%; font-weight: bold; }
        .publish-btn { background: var(--orange); color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; color: var(--orange);">INFINITY STUDIO</div>
    <div style="display:flex; gap:10px;">
        <button onclick="setGizmo('translate')" style="width:40px" class="btn">✛</button>
        <button onclick="setGizmo('rotate')" style="width:40px" class="btn">🔄</button>
        <button onclick="setGizmo('scale')" style="width:40px" class="btn">↔</button>
    </div>
    <button onclick="publish()" class="publish-btn">PUBLIER</button>
</nav>

<div class="main">
    <div id="viewport"></div>
    <div id="logic-panel">
        <div id="nodes-container"></div>
        <button class="btn" onclick="addCube()">+ AJOUTER BLOC</button>
        <button class="btn" onclick="addLogicNode()" style="border-color:var(--orange);">+ LOGIQUE</button>
    </div>
</div>

<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / 50, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 300, window.innerHeight - 50);
    document.getElementById('viewport').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);

    scene.add(new THREE.GridHelper(30, 30, 0x333333, 0x222222));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(10, 10, 10);

    let gameObjects = [];
    let logicNodes = [];

    function addCube(data = null) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xcccccc}));
        if(data) {
            mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
            mesh.rotation.set(data.rot.x, data.rot.y, data.rot.z);
            mesh.scale.set(data.scale.x, data.scale.y, data.scale.z);
        }
        scene.add(mesh);
        gameObjects.push(mesh);
        transform.attach(mesh);
        return mesh;
    }

    function setGizmo(m) { transform.setMode(m); }

    async function publish() {
        const name = new URLSearchParams(window.location.search).get('name') || "Sans Titre";
        const payload = {
            title: name,
            map: gameObjects.map(o => ({
                pos: o.position,
                rot: {x: o.rotation.x, y: o.rotation.y, z: o.rotation.z},
                scale: o.scale
            })),
            logic: logicNodes
        };
        const res = await fetch('https://infinity.pamplemouche.com/api/publish-game', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            credentials: 'include'
        });
        if(res.ok) alert("✅ Sauvegardé !");
    }

    async function loadGame() {
        const name = new URLSearchParams(window.location.search).get('name');
        const res = await fetch('https://infinity.pamplemouche.com/api/get-games');
        const games = await res.json();
        const myGame = games.find(g => g.title === name);
        if(myGame && myGame.map_data) {
            const data = JSON.parse(myGame.map_data);
            data.forEach(obj => addCube(obj));
        }
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
    loadGame();
</script>
</body>
</html>
