<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Editor | 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --bg: #050505; --ui: #121214; --orange: #f29979; --border: #252528; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        nav { height: 50px; background: var(--ui); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
        
        .main-zone { flex: 1; display: flex; position: relative; }
        #viewport { flex: 1; background: #000; }
        
        /* Panneau de Logique Visuelle (Style UE5 Nodes) */
        #logic-panel { width: 300px; background: var(--ui); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .node-area { flex: 1; padding: 15px; overflow-y: auto; }
        .node { background: #1e1e21; border: 1px solid #444; border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 12px; }
        .node-header { color: var(--orange); font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #333; }

        .btn { background: #222; border: 1px solid #444; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn.active { background: var(--orange); color: black; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; color: var(--orange);">INFINITY EDITOR</div>
    <div style="display:flex; gap:10px;">
        <button class="btn active" id="mode-move" onclick="setGizmo('translate')">Déplacer</button>
        <button class="btn" id="mode-rot" onclick="setGizmo('rotate')">Tourner</button>
        <button class="btn" id="mode-scale" onclick="setGizmo('scale')">Taille</button>
    </div>
    <button onclick="publish()" style="background:var(--orange); color:black; font-weight:bold;" class="btn">PUBLIER</button>
</nav>

<div class="main-zone">
    <div id="viewport"></div>
    
    <div id="logic-panel">
        <div style="padding: 15px; border-bottom: 1px solid var(--border); font-weight: bold;">VISUAL LOGIC (UE5)</div>
        <div class="node-area" id="node-list">
            <button class="btn" style="width:100%; margin-bottom:15px;" onclick="addNode('Click')">+ Ajouter Événement</button>
            <div id="nodes-container">
                </div>
        </div>
        <button class="btn" onclick="addCube()" style="margin: 15px;">+ AJOUTER OBJET 3D</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const gameName = urlParams.get('name') || "Nouveau Projet";

    // Setup 3D
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / (window.innerHeight - 50), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 300, window.innerHeight - 50);
    document.getElementById('viewport').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);

    scene.add(new THREE.GridHelper(20, 20, 0x444444, 0x222222));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(5, 5, 5);

    let objects = [];
    let logicNodes = [];

    function addCube() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xf29979}));
        scene.add(mesh);
        objects.push(mesh);
        transform.attach(mesh);
    }

    function setGizmo(mode) {
        transform.setMode(mode);
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        if(mode === 'translate') document.getElementById('mode-move').classList.add('active');
        if(mode === 'rotate') document.getElementById('mode-rot').classList.add('active');
        if(mode === 'scale') document.getElementById('mode-scale').classList.add('active');
    }

    // --- VISUAL CODING LOGIC ---
    function addNode(type) {
        const id = Date.now();
        const nodeHtml = `
            <div class="node" id="node-${id}">
                <div class="node-header">QUAND : ${type}</div>
                <div>Action : <select><option>Tourner</option><option>Disparaître</option><option>Sauter</option></select></div>
                <button onclick="this.parentElement.remove()" style="background:none; border:none; color:red; font-size:10px; cursor:pointer;">Supprimer</button>
            </div>
        `;
        document.getElementById('nodes-container').innerHTML += nodeHtml;
        logicNodes.push({id, type, action: "Tourner"});
    }

    async function publish() {
        const mapData = objects.map(o => ({
            pos: o.position,
            rot: {x: o.rotation.x, y: o.rotation.y, z: o.rotation.z},
            scale: o.scale
        }));

        await fetch('https://infinity.pamplemouche.com/api/publish-game', {
            method: 'POST',
            body: JSON.stringify({
                title: gameName,
                map: mapData,
                logic: logicNodes // On envoie les blocs de logique visuelle
            })
        });
        alert("Jeu publié sur le Launcher !");
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
