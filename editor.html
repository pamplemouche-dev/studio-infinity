<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Editor | No-Code 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --bg: #050505; --ui: #121214; --orange: #f29979; --border: #252528; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        nav { height: 50px; background: var(--ui); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 10; }
        .tool-btn { background: #2a2a2d; border: 1px solid #444; color: white; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 18px; }
        .publish-btn { background: var(--orange); color: black; border: none; padding: 8px 20px; border-radius: 5px; font-weight: 900; cursor: pointer; }

        .main-layout { flex: 1; display: flex; }
        #viewport { flex: 1; cursor: crosshair; }

        /* Visual Logic Panel (Style UE5) */
        #logic-panel { width: 320px; background: var(--ui); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-header { padding: 15px; font-size: 12px; font-weight: bold; color: #888; border-bottom: 1px solid var(--border); }
        .node-list { flex: 1; overflow-y: auto; padding: 10px; }
        .node { background: #1e1e21; border-top: 3px solid var(--orange); border-radius: 6px; padding: 12px; margin-bottom: 15px; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        select { background: #000; color: white; border: 1px solid #444; padding: 5px; width: 100%; margin-top: 5px; border-radius: 4px; }
        
        .footer-tools { padding: 15px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; color: var(--orange);">INFINITY <span style="color:white">STUDIO</span></div>
    <div style="display:flex; gap:10px;">
        <button class="tool-btn" onclick="setGizmo('translate')">✛</button>
        <button class="tool-btn" onclick="setGizmo('rotate')">🔄</button>
        <button class="tool-btn" onclick="setGizmo('scale')">↔</button>
    </div>
    <button onclick="publish()" class="publish-btn">PUBLIER</button>
</nav>

<div class="main-layout">
    <div id="viewport"></div>
    
    <div id="logic-panel">
        <div class="panel-header">VISUAL LOGIC (NO-CODE)</div>
        <div class="node-list" id="nodes-container">
            </div>
        <div class="footer-tools">
            <button class="tool-btn" style="font-size:13px;" onclick="addCube()">+ AJOUTER CUBE</button>
            <button class="tool-btn" style="font-size:13px; border-color:var(--orange);" onclick="addLogicNode()">+ ÉVÉNEMENT LOGIQUE</button>
        </div>
    </div>
</div>

<script>
    // --- INITIALISATION 3D ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 320) / (window.innerHeight - 50), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 320, window.innerHeight - 50);
    document.getElementById('viewport').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);

    scene.add(new THREE.GridHelper(30, 30, 0x333333, 0x222222));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(10, 10, 10);

    let gameObjects = [];
    let logicNodes = [];

    function addCube() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xf29979}));
        scene.add(mesh);
        gameObjects.push(mesh);
        transform.attach(mesh);
    }

    function setGizmo(mode) { transform.setMode(mode); }

    // --- VISUAL CODING (SYSTEME DE NODES) ---
    function addLogicNode() {
        const id = Date.now();
        const nodeHtml = `
            <div class="node" id="node-${id}">
                <strong>QUAND :</strong>
                <select onchange="updateNode(${id}, 'event', this.value)">
                    <option value="click">Au Clic</option>
                    <option value="touch">Au Contact</option>
                    <option value="start">Au Démarrage</option>
                </select>
                <div style="margin-top:10px;"><strong>ALORS :</strong></div>
                <select onchange="updateNode(${id}, 'action', this.value)">
                    <option value="rotate">Rotation</option>
                    <option value="jump">Sauter</option>
                    <option value="hide">Disparaître</option>
                </select>
                <button onclick="removeNode(${id})" style="margin-top:10px; background:none; border:none; color:#ff4444; font-size:10px; cursor:pointer;">Supprimer</button>
            </div>
        `;
        document.getElementById('nodes-container').innerHTML += nodeHtml;
        logicNodes.push({ id, event: 'click', action: 'rotate' });
    }

    function updateNode(id, key, value) {
        const node = logicNodes.find(n => n.id === id);
        if(node) node[key] = value;
    }

    function removeNode(id) {
        logicNodes = logicNodes.filter(n => n.id !== id);
        document.getElementById(`node-${id}`).remove();
    }

    // --- PUBLICATION ---
    async function publish() {
        const urlParams = new URLSearchParams(window.location.search);
        const gameName = urlParams.get('name') || "Mon Monde";

        const data = {
            title: gameName,
            map: gameObjects.map(o => ({ 
                pos: o.position, 
                rot: {x: o.rotation.x, y: o.rotation.y, z: o.rotation.z}, 
                scale: o.scale 
            })),
            logic: logicNodes
        };

        try {
            const res = await fetch('https://infinity.pamplemouche.com/api/publish-game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if(res.ok) alert("🚀 Jeu publié !");
        } catch(e) { alert("Erreur de connexion au serveur."); }
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = (window.innerWidth - 320) / (window.innerHeight - 50);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 320, window.innerHeight - 50);
    });
</script>
</body>
</html>
