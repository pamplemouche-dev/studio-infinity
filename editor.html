<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Studio | Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --bg: #050505; --panel: #121214; --orange: #f29979; --border: #252528; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        nav { position: fixed; top: 0; width: 100%; height: 55px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); z-index: 1000; }
        #viewport { position: absolute; inset: 55px 0 0 0; touch-action: none; }
        .tool-btn { background: #222; border: 1px solid #444; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .tool-btn.active { background: var(--orange); color: black; border-color: var(--orange); }
    </style>
</head>
<body>

<nav>
    <div style="display:flex; flex-direction:column;">
        <span id="project-name" style="font-weight:900; color:var(--orange); font-size:14px;">PROJET</span>
        <span id="user-display" style="font-size:10px; color:#666;">@pseudo</span>
    </div>
    
    <div style="display:flex; gap:8px;">
        <button id="m-move" class="tool-btn active" onclick="setMode('translate')">Bouger</button>
        <button id="m-rot" class="tool-btn" onclick="setMode('rotate')">Tourner</button>
        <button id="m-scale" class="tool-btn" onclick="setMode('scale')">Taille</button>
    </div>

    <button onclick="publish()" style="background:var(--orange); color:black;" class="tool-btn">PUBLIER</button>
</nav>

<div id="viewport"></div>

<script>
    // Récupération du pseudo et du nom du jeu
    const urlParams = new URLSearchParams(window.location.search);
    const gameName = urlParams.get('name') || "Nouveau Jeu";
    const cookies = document.cookie.split('; ').reduce((prev, curr) => {
        const [name, value] = curr.split('=');
        prev[name] = value;
        return prev;
    }, {});
    const pseudo = cookies['pamplemouche_session'] || "Invité";

    document.getElementById('project-name').innerText = gameName.toUpperCase();
    document.getElementById('user-display').innerText = "@" + pseudo;

    // Configuration Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight - 55), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight - 55);
    document.getElementById('viewport').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);

    scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x111111));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(5, 5, 5);

    let objects = [];

    function setMode(mode) {
        transform.setMode(mode);
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        if(mode === 'translate') document.getElementById('m-move').classList.add('active');
        if(mode === 'rotate') document.getElementById('btn-rot').classList.add('active');
        if(mode === 'scale') document.getElementById('btn-scale').classList.add('active');
    }

    async function publish() {
        const mapData = objects.map(o => ({
            pos: o.position,
            rot: { x: o.rotation.x, y: o.rotation.y, z: o.rotation.z },
            scale: o.scale,
            color: o.material.color.getHex()
        }));

        try {
            const res = await fetch('https://infinity.pamplemouche.com/api/publish-game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: gameName, map: mapData, logic: {} })
            });
            const result = await res.json();
            if(result.success) alert(result.mode === "updated" ? "Mise à jour réussie !" : "Projet publié !");
        } catch(e) { alert("Erreur serveur (Vérifie la connexion)."); }
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
