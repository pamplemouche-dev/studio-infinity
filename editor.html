<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Studio | Professional Engine</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

    <style>
        :root { --bg: #050505; --panel: #121214; --orange: #f29979; --border: #252528; }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        /* Nav */
        nav { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); z-index: 9999; }
        .mode-btn { background: #222; border: none; color: #666; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: var(--orange); color: black; }

        /* Zones */
        #viewport-3d { position: absolute; inset: 50px 0 0 0; background: #000; }
        #node-editor { position: absolute; inset: 50px 0 0 0; background: #0a0a0a; display: none; z-index: 5000; }

        /* Noeuds */
        .node { position: absolute; background: #1e1e21; border: 1px solid #444; border-radius: 8px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .node-header { padding: 10px; background: #2a2a2e; cursor: grab; font-size: 11px; font-weight: bold; border-radius: 8px 8px 0 0; color: var(--orange); }
        .node-content { padding: 15px; font-size: 11px; display: flex; justify-content: space-between; }
        .port { width: 10px; height: 10px; background: #555; border-radius: 50%; display: inline-block; border: 1px solid #000; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; color: var(--orange)">INFINITY STUDIO</div>
    <div style="display:flex; gap:10px;">
        <button id="btn-3d" class="mode-btn active" onclick="setMode('3d')">3D VIEW</button>
        <button id="btn-bp" class="mode-btn" onclick="setMode('bp')">BLUEPRINTS</button>
    </div>
    <button class="mode-btn" style="background:var(--orange); color:black" onclick="publish()">PUBLIER</button>
</nav>

<div id="viewport-3d"></div>
<div id="node-editor"></div>

<script>
    // --- 3D ENGINE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight-50), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight - 50);
    document.getElementById('viewport-3d').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x111111));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(5,5,5);

    let objects = [];
    function addCube() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xf29979}));
        mesh.name = "Cube_" + Date.now();
        scene.add(mesh);
        objects.push(mesh);
    }
    addCube();

    // --- NODE ENGINE ---
    const nodeArea = document.getElementById('node-editor');
    function createNode(title, x, y) {
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = x + 'px'; node.style.top = y + 'px';
        node.innerHTML = `<div class="node-header">${title}</div><div class="node-content"><span>● In</span><span>Out ●</span></div>`;
        
        const header = node.querySelector('.node-header');
        header.onpointerdown = (e) => {
            let startX = e.clientX - node.offsetLeft;
            let startY = e.clientY - node.offsetTop;
            const move = (e) => {
                node.style.left = (e.clientX - startX) + 'px';
                node.style.top = (e.clientY - startY) + 'px';
            };
            window.onpointermove = move;
            window.onpointerup = () => window.onpointermove = null;
        };
        nodeArea.appendChild(node);
    }
    createNode("EVENT: START", 50, 100);
    createNode("ACTION: MOVE", 280, 150);

    // --- API SYNC ---
    function setMode(m) {
        const is3 = m === '3d';
        document.getElementById('viewport-3d').style.display = is3 ? 'block' : 'none';
        document.getElementById('node-editor').style.display = is3 ? 'none' : 'block';
        document.getElementById('btn-3d').classList.toggle('active', is3);
        document.getElementById('btn-bp').classList.toggle('active', !is3);
    }

    async function publish() {
        const title = prompt("Nom du jeu :");
        if(!title) return;

        const data = {
            title: title,
            map: objects.map(o => ({ name: o.name, pos: o.position, color: o.material.color.getHex() })),
            logic: { nodes: [] } // À remplir avec les positions des nodes
        };

        const res = await fetch('https://infinity.pamplemouche.com/api/publish-game', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if(res.ok) alert("Jeu publié !");
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
