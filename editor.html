<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <style>
        :root { --bg: #050505; --ui: #121214; --orange: #f29979; --border: #252528; }
        body { margin: 0; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        nav { height: 55px; background: var(--ui); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); }
        .main-zone { flex: 1; display: flex; }
        #viewport { flex: 1; }
        #logic-panel { width: 300px; background: var(--ui); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; }
        .node { background: #1e1e21; border-top: 3px solid var(--orange); padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 12px; }
        .btn { background: #2a2a2d; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .publish-btn { background: var(--orange); color: black; border: none; padding: 10px 20px; border-radius: 5px; font-weight: 900; }
        select { width: 100%; background: #000; color: white; border: 1px solid #444; margin: 5px 0; }
    </style>
</head>
<body>

<nav>
    <div style="font-weight: 900; color: var(--orange);">INFINITY STUDIO</div>
    <div style="display:flex; gap:10px;">
        <button class="btn" onclick="setGizmo('translate')">✛</button>
        <button class="btn" onclick="setGizmo('rotate')">🔄</button>
        <button class="btn" onclick="setGizmo('scale')">↔</button>
    </div>
    <button onclick="publish()" class="publish-btn">PUBLIER</button>
</nav>

<div class="main-zone">
    <div id="viewport"></div>
    <div id="logic-panel">
        <div style="font-weight:bold; color:#666; margin-bottom:10px;">VISUAL LOGIC</div>
        <div id="nodes-container" style="flex:1; overflow-y:auto;"></div>
        <button class="btn" onclick="addCube()" style="margin-bottom:5px;">+ OBJET 3D</button>
        <button class="btn" onclick="addLogicNode()" style="border-color:var(--orange);">+ ÉVÉNEMENT</button>
    </div>
</div>

<script>
    // --- 3D SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 300) / (window.innerHeight - 55), 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 300, window.innerHeight - 55);
    document.getElementById('viewport').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const transform = new THREE.TransformControls(camera, renderer.domElement);
    scene.add(transform);
    transform.addEventListener('dragging-changed', (e) => controls.enabled = !e.value);

    scene.add(new THREE.GridHelper(30, 30, 0x333333, 0x222222));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    camera.position.set(10, 10, 10);

    let gameObjects = [];
    let logicNodes = [];

    function addCube() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xcccccc}));
        scene.add(mesh);
        gameObjects.push(mesh);
        transform.attach(mesh);
    }

    function setGizmo(mode) { transform.setMode(mode); }

    // --- LOGIC SYSTEM ---
    function addLogicNode() {
        const id = Date.now();
        const nodeHtml = `
            <div class="node" id="n-${id}">
                QUAND : <select onchange="updateNode(${id},'e',this.value)"><option value="click">Clic</option><option value="touch">Touch</option></select>
                ALORS : <select onchange="updateNode(${id},'a',this.value)"><option value="rot">Rotation</option><option value="hide">Cacher</option></select>
                <button onclick="document.getElementById('n-${id}').remove()" style="color:red; background:none; border:none; font-size:10px;">Supprimer</button>
            </div>
        `;
        document.getElementById('nodes-container').innerHTML += nodeHtml;
        logicNodes.push({id, e: 'click', a: 'rot'});
    }

    function updateNode(id, k, v) {
        const n = logicNodes.find(x => x.id === id);
        if(n) n[k] = v;
    }

    // --- PUBLICATION (RETOUR STABILITÉ) ---
    async function publish() {
        const name = new URLSearchParams(window.location.search).get('name') || "Sans Titre";
        
        const payload = {
            title: name,
            map: gameObjects.map(o => ({
                pos: o.position,
                rot: {x: o.rotation.x, y: o.rotation.y, z: o.rotation.z},
                scale: o.scale
            })),
            logic: logicNodes
        };

        try {
            const res = await fetch('https://infinity.pamplemouche.com/api/publish-game', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'include'
            });

            if (res.ok) {
                const r = await res.json();
                alert("✅ Publié avec succès !");
            } else {
                alert("❌ Erreur serveur : " + res.status);
            }
        } catch (e) {
            alert("❌ Erreur réseau : " + e.message);
        }
    }

    function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
    animate();
</script>
</body>
</html>
