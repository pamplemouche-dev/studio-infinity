<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Studio | High-Res Blueprints</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    
    <link rel="stylesheet" type="text/css" href="https://tamats.com/projects/litegraph/css/litegraph.css">
    <script type="text/javascript" src="https://tamats.com/projects/litegraph/build/litegraph.js"></script>

    <style>
        :root { --bg: #0b0b0d; --panel: #141417; --orange: #f29979; --border: #252528; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { height: 50px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); }

        /* Navigation Modes */
        .mode-tabs { display: flex; gap: 5px; background: #000; padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-btn { padding: 6px 20px; border-radius: 7px; cursor: pointer; border: none; background: transparent; color: #666; font-size: 12px; font-weight: 600; transition: 0.2s; }
        .tab-btn.active { background: #1e1e21; color: var(--orange); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        .editor-container { flex: 1; display: flex; overflow: hidden; }

        /* Hiérarchie Pro */
        .sidebar { width: 240px; background: var(--panel); border-right: 1px solid var(--border); }
        .sidebar-title { padding: 12px; font-size: 10px; color: #555; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid var(--border); }
        .obj-item { padding: 10px 15px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #1a1a1d; display: flex; align-items: center; gap: 10px; }
        .obj-item:hover { background: #1c1c1f; }
        .obj-item.selected { background: #222226; color: var(--orange); }

        /* Zone de travail HD */
        .workspace { flex: 1; position: relative; }
        #viewport-3d, #blueprint-canvas { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* Customisation LiteGraph pour qualité "Unreal" */
        .litegraph .lgraphcanvas { background-color: #0e0e10 !important; }
        /* On force le lissage des polices */
        canvas { image-rendering: -webkit-optimize-contrast; font-smoothing: antialiased; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; letter-spacing: 1px; font-size: 18px;">INFINITY <span style="color:var(--orange)">STUDIO</span></div>
    
    <div class="mode-tabs">
        <button id="btn-3d" class="tab-btn active" onclick="switchView('3d')">VIEWPORT</button>
        <button id="btn-bp" class="tab-btn" onclick="switchView('bp')">BLUEPRINTS</button>
    </div>

    <button onclick="addCube()" style="background:var(--orange); border:none; padding:8px 18px; border-radius:6px; font-weight:bold; cursor:pointer;">PUBLIER</button>
</header>

<div class="editor-container">
    <aside class="sidebar">
        <div class="sidebar-title">Outliner</div>
        <div id="obj-list"></div>
    </aside>

    <main class="workspace">
        <div id="viewport-3d"></div>
        <canvas id="blueprint-canvas"></canvas>
    </main>
</div>

<script>
    // --- INITIALISATION 3D ---
    const vp = document.getElementById('viewport-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e0e10);
    const camera = new THREE.PerspectiveCamera(75, vp.clientWidth / vp.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(window.devicePixelRatio); // FIX QUALITÉ ÉCRAN
    renderer.setSize(vp.clientWidth, vp.clientHeight);
    vp.appendChild(renderer.domElement);

    camera.position.set(3, 3, 3);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x1a1a1a));
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    // --- SYSTÈME DE NOEUDS APPROFONDI (Blueprints) ---
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#blueprint-canvas", graph);
    
    // Style des Noeuds "Unreal"
    LiteGraph.NODE_TITLE_HEIGHT = 30;
    LiteGraph.NODE_SLOT_HEIGHT = 20;
    LiteGraph.NODE_WIDTH = 160;
    canvas.title_text_font = "bold 12px Inter";
    canvas.inner_text_font = "normal 10px Inter";
    canvas.render_shadows = true;
    canvas.highprecision_render = true; // FORCE LA QUALITÉ HD

    // Création de Noeuds Basiques Utiles
    function setupBlueprints() {
        // Noeud : Quand le jeu commence
        function EventStart() { this.addOutput("Exec", LiteGraph.EVENT); }
        EventStart.title = "Begin Play";
        EventStart.title_color = "#3d85c6"; // Bleu Unreal
        LiteGraph.registerNodeType("events/begin_play", EventStart);

        // Noeud : Déplacer Objet
        function MoveTo() {
            this.addInput("Exec", LiteGraph.ACTION);
            this.addInput("Target", "string");
            this.addInput("X", "number");
            this.addProperty("speed", 1.0);
        }
        MoveTo.title = "Set Actor Location";
        MoveTo.title_color = "#38761d"; // Vert Action
        LiteGraph.registerNodeType("actions/move_to", MoveTo);

        // Noeud : Variable Vitesse
        function FloatValue() {
            this.addOutput("Value", "number");
            this.addProperty("val", 5.0);
            this.widget = this.addWidget("number","Vitesse", 5, (v) => { this.properties.val = v; });
        }
        FloatValue.title = "Float Variable";
        LiteGraph.registerNodeType("math/float", FloatValue);

        // Exemple de graph par défaut
        const n1 = LiteGraph.createNode("events/begin_play"); n1.pos = [50, 100]; graph.add(n1);
        const n2 = LiteGraph.createNode("actions/move_to"); n2.pos = [300, 100]; graph.add(n2);
        const n3 = LiteGraph.createNode("math/float"); n3.pos = [50, 200]; graph.add(n3);
        
        n1.connect(0, n2, 0);
        n3.connect(0, n2, 2);
    }
    setupBlueprints();

    // --- GESTION DES VUES ---
    function switchView(mode) {
        const is3D = mode === '3d';
        document.getElementById('viewport-3d').style.display = is3D ? 'block' : 'none';
        document.getElementById('blueprint-canvas').style.display = is3D ? 'none' : 'block';
        document.getElementById('btn-3d').className = 'tab-btn' + (is3D ? ' active' : '');
        document.getElementById('btn-bp').className = 'tab-btn' + (!is3D ? ' active' : '');
        
        if(!is3D) {
            canvas.resize(); // Recalcule la taille pour éviter le flou
        }
    }

    function addCube() {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color:0xf29979}));
        mesh.name = "Cube_" + Math.floor(Math.random()*100);
        scene.add(mesh);
        updateList();
    }

    function updateList() {
        const list = document.getElementById('obj-list');
        list.innerHTML = scene.children.filter(c => c.type === "Mesh").map(m => `
            <div class="obj-item">📦 ${m.name}</div>
        `).join('');
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Gestion du Resize pour garder la netteté
    window.onresize = () => {
        renderer.setSize(vp.clientWidth, vp.clientHeight);
        camera.aspect = vp.clientWidth / vp.clientHeight;
        camera.updateProjectionMatrix();
        canvas.resize();
    };
</script>
</body>
</html>
