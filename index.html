<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Infinity Studio | Blueprints Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://tamats.com/projects/litegraph/css/litegraph.css">
    <script type="text/javascript" src="https://tamats.com/projects/litegraph/build/litegraph.js"></script>

    <style>
        :root { --bg: #0a0a0a; --panel: #161618; --orange: #f29979; --blue: #3498db; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; }
        
        header { height: 50px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #222; z-index: 10; }
        
        .main-container { display: flex; height: calc(100% - 50px); }

        /* Zones de travail */
        #viewport-3d { flex: 1; background: #000; position: relative; }
        #blueprint-canvas { flex: 1; background: #111; display: none; }

        /* Sidebar Propriétés */
        .inspector { width: 250px; background: var(--panel); border-left: 1px solid #222; padding: 15px; }

        .btn-mode { padding: 8px 15px; cursor: pointer; border-radius: 4px; border: 1px solid #333; background: #222; color: #888; font-size: 12px; }
        .btn-mode.active { border-color: var(--orange); color: var(--orange); font-weight: bold; }
        
        .publish-btn { background: var(--orange); color: black; border: none; padding: 8px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; letter-spacing: 1px;">INFINITY <span style="color:var(--orange)">STUDIO</span></div>
    <div style="display:flex; gap:10px;">
        <button id="tab-3d" class="btn-mode active" onclick="setMode('3d')">VIEWPORT 3D</button>
        <button id="tab-blueprints" class="btn-mode" onclick="setMode('blueprints')">BLUEPRINTS</button>
    </div>
    <button class="publish-btn">PUBLIER LE JEU</button>
</header>

<div class="main-container">
    <div id="viewport-3d"></div>

    <canvas id="blueprint-canvas"></canvas>

    <aside class="inspector">
        <h4 style="margin-top:0; color:var(--orange)">DÉTAILS</h4>
        <div id="outliner" style="font-size:12px; color:#aaa;">
            <p>• SceneRoot</p>
            <p>• DirectionalLight</p>
            <p style="color:white">• Cube_01 (Selected)</p>
        </div>
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <label style="font-size:10px; display:block; margin-bottom:5px;">TRANSFORM</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:5px;">
            <input type="number" value="0" style="background:#000; border:1px solid #444; color:white; padding:3px;">
            <input type="number" value="0" style="background:#000; border:1px solid #444; color:white; padding:3px;">
            <input type="number" value="0" style="background:#000; border:1px solid #444; color:white; padding:3px;">
        </div>
    </aside>
</div>

<script>
    // --- 1. MOTEUR 3D (Three.js) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    const view3d = document.getElementById('viewport-3d');
    
    renderer.setSize(view3d.clientWidth, view3d.clientHeight);
    view3d.appendChild(renderer.domElement);

    // Cube de démo
    const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
    const material = new THREE.MeshStandardMaterial({ color: 0xf29979 });
    const cube = new THREE.Mesh(geometry, material);
    scene.add(cube);

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    camera.position.z = 5;

    function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
    }
    animate();

    // --- 2. MOTEUR BLUEPRINTS (LiteGraph) ---
    const graph = new LGraph();
    const canvas = new LGraphCanvas("#blueprint-canvas", graph);
    
    // Ajuster la taille du canvas
    function resizeBlueprints() {
        const parent = document.getElementById('blueprint-canvas').parentElement;
        canvas.resize(parent.clientWidth - 250, parent.clientHeight);
    }

    // Création de nœuds personnalisés type "Unreal"
    function createDemoNodes() {
        const node_event = LiteGraph.createNode("events/on_tick");
        node_event.pos = [100, 100];
        graph.add(node_event);

        const node_move = LiteGraph.createNode("geometry/transform");
        node_move.pos = [400, 100];
        graph.add(node_move);

        node_event.connect(0, node_move, 0);
    }
    createDemoNodes();

    // --- 3. GESTION DES MODES ---
    function setMode(mode) {
        const v3d = document.getElementById('viewport-3d');
        const vbp = document.getElementById('blueprint-canvas');
        const t3d = document.getElementById('tab-3d');
        const tbp = document.getElementById('tab-blueprints');

        if (mode === '3d') {
            v3d.style.display = 'block';
            vbp.style.display = 'none';
            t3d.classList.add('active');
            tbp.classList.remove('active');
        } else {
            v3d.style.display = 'none';
            vbp.style.display = 'block';
            t3d.classList.remove('active');
            tbp.classList.add('active');
            resizeBlueprints();
        }
    }

    window.addEventListener('resize', () => {
        renderer.setSize(view3d.clientWidth, view3d.clientHeight);
        camera.aspect = view3d.clientWidth / view3d.clientHeight;
        camera.updateProjectionMatrix();
        resizeBlueprints();
    });
</script>
</body>
</html>
