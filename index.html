<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinity Studio v2 | Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root { --bg: #050505; --panel: #121214; --orange: #f29979; --border: #252528; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; font-family: sans-serif; overflow: hidden; }
        
        /* Navigation Toujours Visible */
        .top-nav { 
            position: fixed; top: 0; left: 0; right: 0; height: 50px; 
            background: var(--panel); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border);
            z-index: 9999; /* Toujours au-dessus de tout */
        }

        .main-content { display: flex; height: 100vh; padding-top: 50px; box-sizing: border-box; }

        /* Editeur de Noeuds */
        #node-editor {
            position: absolute; inset: 50px 0 0 0; background: #0a0a0a;
            display: none; z-index: 5000; touch-action: none;
        }

        /* Design des Noeuds Net & Stable */
        .node {
            position: absolute; background: #1e1e21; border: 1px solid #444;
            border-radius: 8px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }
        .node-header { 
            padding: 10px; background: #2a2a2e; border-bottom: 1px solid #444; 
            cursor: grab; font-size: 11px; font-weight: bold; border-radius: 8px 8px 0 0;
            color: var(--orange);
        }
        .node-content { padding: 15px; font-size: 12px; }
        .port { width: 12px; height: 12px; background: #555; border-radius: 50%; display: inline-block; cursor: crosshair; border: 2px solid #1e1e21; }
        .port:hover { background: var(--orange); }

        #viewport-3d { flex: 1; background: #000; }

        .active-view { background: var(--orange) !important; color: black !important; }
        .btn { background: #222; border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<nav class="top-nav">
    <div style="font-weight: 900; color: var(--orange)">INFINITY STUDIO</div>
    <div style="display:flex; gap:10px;">
        <button id="btn-3d" class="btn active-view" onclick="setMode('3d')">3D VIEW</button>
        <button id="btn-bp" class="btn" onclick="setMode('bp')">BLUEPRINTS</button>
    </div>
    <button class="btn" style="background:#444">PUBLIER</button>
</nav>

<div class="main-content">
    <div id="viewport-3d"></div>
    <div id="node-editor">
        </div>
</div>

<script>
    // --- 1. SETUP 3D (Net & Responsive) ---
    const vp = document.getElementById('viewport-3d');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight - 50);
    vp.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    scene.add(new THREE.GridHelper(20, 20, 0x222222, 0x111111));
    scene.add(new THREE.AmbientLight(0xffffff, 1));
    
    const cube = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial({color: 0xf29979}));
    scene.add(cube);
    camera.position.set(3,3,3);

    // --- 2. SETUP NOEUDS (Stable Move) ---
    const nodeArea = document.getElementById('node-editor');

    function createNode(title, x, y) {
        const node = document.createElement('div');
        node.className = 'node';
        node.style.left = x + 'px';
        node.style.top = y + 'px';
        
        node.innerHTML = `
            <div class="node-header">${title}</div>
            <div class="node-content">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span><div class="port"></div> In</span>
                    <span>Out <div class="port"></div></span>
                </div>
            </div>
        `;

        const header = node.querySelector('.node-header');
        let isDragging = false;
        let startX, startY;

        header.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX - node.offsetLeft;
            startY = e.clientY - node.offsetTop;
            header.style.cursor = 'grabbing';
            node.setPointerCapture(e.pointerId);
            e.stopPropagation(); // Empêche de cliquer à travers
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            node.style.left = (e.clientX - startX) + 'px';
            node.style.top = (e.clientY - startY) + 'px';
        });

        window.addEventListener('pointerup', (e) => {
            isDragging = false;
            header.style.cursor = 'grab';
        });

        nodeArea.appendChild(node);
    }

    createNode("EVENT: ON_START", 100, 100);
    createNode("ACTION: ROTATE", 350, 150);

    // --- 3. GESTION DU SWITCH ---
    function setMode(mode) {
        const is3D = mode === '3d';
        document.getElementById('node-editor').style.display = is3D ? 'none' : 'block';
        document.getElementById('btn-3d').classList.toggle('active-view', is3D);
        document.getElementById('btn-bp').classList.toggle('active-view', !is3D);
        
        // Relancer le rendu ThreeJS si on revient en 3D
        if(is3D) {
            renderer.setSize(window.innerWidth, window.innerHeight - 50);
            camera.aspect = window.innerWidth / (window.innerHeight - 50);
            camera.updateProjectionMatrix();
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    // Resize intelligent
    window.addEventListener('resize', () => {
        const h = window.innerHeight - 50;
        renderer.setSize(window.innerWidth, h);
        camera.aspect = window.innerWidth / h;
        camera.updateProjectionMatrix();
    });
</script>
</body>
</html>
