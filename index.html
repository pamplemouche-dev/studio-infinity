<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Studio | Hub</title>
    <style>
        :root { --bg: #0f0f11; --panel: #18181b; --orange: #f29979; --border: #27272a; --text: #efeff1; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; }
        
        /* Sidebar à la Roblox Studio */
        aside { width: 220px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; }
        .nav-item { padding: 12px 25px; cursor: pointer; font-weight: 500; color: #a1a1aa; }
        .nav-item.active { background: #27272a; color: white; border-left: 4px solid var(--orange); }
        
        /* Main Content */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-tag { background: #27272a; padding: 5px 15px; border-radius: 20px; font-size: 13px; border: 1px solid var(--border); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .project-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.2s; }
        .project-card:hover { border-color: var(--orange); transform: translateY(-3px); }
        .card-thumb { height: 120px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .card-info { padding: 15px; font-size: 14px; font-weight: bold; }

        .btn-new { background: var(--orange); color: black; border: none; padding: 12px 25px; border-radius: 8px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

<aside>
    <div style="padding: 0 25px 30px; font-weight: 900; color: var(--orange); font-size: 20px;">INFINITY</div>
    <div class="nav-item active">Mes Jeux</div>
    <div class="nav-item">Modèles</div>
    <div class="nav-item">Paramètres</div>
</aside>

<main>
    <div class="header">
        <h1>Accueil</h1>
        <div class="user-tag" id="user-display">@Chargement...</div>
    </div>

    <button class="btn-new" onclick="createNew()">+ NOUVEAU PROJET</button>

    <h3 style="margin-top:40px; color:#71717a; font-size:12px; text-transform:uppercase;">Projets Récents</h3>
    <div class="grid" id="project-grid"></div>
</main>

<script>
    // Vérification session & Pseudo
    const cookies = document.cookie.split('; ').reduce((prev, curr) => {
        const [name, value] = curr.split('=');
        prev[name] = value;
        return prev;
    }, {});
    const pseudo = cookies['pamplemouche_session'];
    if (!pseudo) window.location.href = "https://infinity.pamplemouche.com/connect/index.html?from=studio";
    document.getElementById('user-display').innerText = "@" + pseudo;

    async function loadProjects() {
        const res = await fetch('https://infinity.pamplemouche.com/api/get-games');
        const games = await res.json();
        const grid = document.getElementById('project-grid');
        // On ne montre que les jeux créés par l'utilisateur
        const myGames = games.filter(g => g.creator_id === pseudo);
        
        grid.innerHTML = myGames.map(g => `
            <div class="project-card" onclick="window.location.href='editor.html?name=${encodeURIComponent(g.title)}'">
                <div class="card-thumb">📦</div>
                <div class="card-info">${g.title}</div>
            </div>
        `).join('');
    }

    function createNew() {
        const name = prompt("Nom du monde :");
        if(name) window.location.href = `editor.html?name=${encodeURIComponent(name)}`;
    }

    loadProjects();
</script>
</body>
</html>
