<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Infinity Studio | Engine</title>
    <style>
        :root { --bg: #0a0a0a; --panel: #161618; --orange: #f29979; }
        body { margin: 0; background: var(--bg); color: white; font-family: system-ui; display: flex; height: 100vh; flex-direction: column; }
        header { height: 50px; background: var(--panel); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #222; }
        .editor { flex: 1; display: flex; }
        .tools { width: 70px; background: var(--panel); border-right: 1px solid #222; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .viewport { flex: 1; position: relative; background-image: radial-gradient(#222 1px, transparent 1px); background-size: 30px 30px; overflow: hidden; }
        .inspector { width: 260px; background: var(--panel); border-left: 1px solid #222; padding: 20px; }
        
        .obj { position: absolute; border: 2px solid transparent; cursor: grab; transition: border 0.1s; }
        .obj:active { cursor: grabbing; }
        .selected { border-color: var(--orange) !important; box-shadow: 0 0 15px rgba(242, 153, 121, 0.3); }
        
        .btn-save { background: var(--orange); border: none; padding: 8px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; letter-spacing: 1px;">STUDIO <span style="color:var(--orange)">INFINITY</span></div>
    <button class="btn-save" onclick="publishMap()">PUBLIER SUR LE HUB</button>
</header>

<div class="editor">
    <aside class="tools">
        <button onclick="spawn('cube')" style="font-size:25px; background:none; border:none; cursor:pointer;">📦</button>
        <button onclick="spawn('sphere')" style="font-size:25px; background:none; border:none; cursor:pointer;">🔴</button>
    </aside>

    <main class="viewport" id="world"></main>

    <aside class="inspector">
        <h4 style="margin:0 0 20px 0">Propriétés</h4>
        <div id="no-sel" style="color:#555">Sélectionnez un objet</div>
        <div id="controls" style="display:none">
            <label style="font-size:12px; color:#888">Couleur</label>
            <input type="color" id="obj-color" oninput="updateObj()" style="width:100%; height:40px; margin-bottom:15px; background:none; border:none;">
            <button onclick="deleteObj()" style="width:100%; background:#422; color:#f55; border:1px solid #f55; padding:8px; border-radius:5px; cursor:pointer">Supprimer</button>
        </div>
    </aside>
</div>

<script>
    let selected = null;
    let mapData = [];

    function spawn(type) {
        const el = document.createElement('div');
        el.className = 'obj';
        el.style.width = '80px';
        el.style.height = '80px';
        el.style.left = '100px';
        el.style.top = '100px';
        el.style.backgroundColor = '#555';
        if(type === 'sphere') el.style.borderRadius = '50%';

        el.onmousedown = (e) => {
            select(el);
            let startX = e.clientX - el.offsetLeft;
            let startY = e.clientY - el.offsetTop;
            
            function move(e) {
                el.style.left = (e.clientX - startX) + 'px';
                el.style.top = (e.clientY - startY) + 'px';
            }
            window.onmousemove = move;
            window.onmouseup = () => window.onmousemove = null;
        };

        document.getElementById('world').appendChild(el);
        select(el);
    }

    function select(el) {
        if(selected) selected.classList.remove('selected');
        selected = el;
        selected.classList.add('selected');
        document.getElementById('no-sel').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
    }

    function updateObj() {
        if(selected) selected.style.backgroundColor = document.getElementById('obj-color').value;
    }

    function deleteObj() {
        if(selected) { selected.remove(); selected = null; document.getElementById('no-sel').style.display = 'block'; document.getElementById('controls').style.display = 'none'; }
    }

    async function publishMap() {
        const objects = Array.from(document.querySelectorAll('.obj')).map(el => ({
            x: el.style.left,
            y: el.style.top,
            color: el.style.backgroundColor,
            radius: el.style.borderRadius
        }));
        
        console.log("Données de la carte :", objects);
        alert("Carte envoyée à l'API !");
        // Ici on fera le fetch vers ton Worker
    }
</script>
</body>
</html>
